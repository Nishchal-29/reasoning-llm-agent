[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-llm-agent"
version = "1.0.0"
description = "A modular Reasoning LLM Agent framework: SFT → ReAct → GRPO pipeline targeting Qwen2.5-3B via Unsloth QLoRA."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",

    # Symbolic math
    "sympy>=1.12",

    # Web search
    "duckduckgo-search>=6.0.0",

    # UI
    "streamlit>=1.35.0",

    # Utilities
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
# Unsloth is installed separately (Colab-specific wheels)
unsloth = [
    "unsloth[colab-new]",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "tools*",
    "training*",
    "inference*",
    "evaluation*",
    "datasets*",
    "app*",
    "agent*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
